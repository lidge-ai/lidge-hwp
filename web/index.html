<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>종이 — 문서 작업대</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip" href="#editor">편집기로 건너뛰기</a>
  <header><h1 class="wordmark" aria-label="종이 (Jongi)"><span class="wordmark-en" aria-hidden="true">jongi</span><span class="wordmark-ko" aria-hidden="true">종이</span></h1><span id="filename">문서를 선택하세요</span><span id="doc-format" class="fmt" hidden></span><button id="copy-path" type="button" title="경로 복사 (⌘⇧C)" aria-keyshortcuts="Meta+Shift+C" disabled>경로 복사</button><p id="status" role="status" aria-live="polite">문서 목록을 불러오는 중</p><span class="new-group"><button id="new-doc" type="button" title="새 한글 문서 (⌥⌘N)" aria-keyshortcuts="Alt+Meta+N Meta+N">새 문서</button><button id="new-menu" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="new-menu-list" aria-label="다른 형식으로 새 문서" title="다른 형식으로 새 문서"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="14" height="14" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button><div id="new-menu-list" role="menu" aria-label="새 문서 형식" hidden><button type="button" role="menuitem" data-new="hwp">한글 문서<span class="fmt" data-fmt="hwp">HWP</span></button><button type="button" role="menuitem" data-new="xlsx">스프레드시트<span class="fmt" data-fmt="xlsx">XLSX</span></button><button type="button" role="menuitem" data-new="docx">워드 문서<span class="fmt" data-fmt="docx">DOCX</span></button><hr><button type="button" role="menuitem" data-new="google">Google에서 가져오기…</button></div></span><button id="save" type="button" disabled>저장</button></header>
  <div class="layout">
    <aside id="doc-list" aria-label="문서 목록"><div class="sidebar-top"><h2>문서함</h2><button id="sidebar-toggle" type="button" aria-controls="doc-list" aria-expanded="true" aria-label="문서 목록 접기" title="문서 목록 접기"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button></div><div class="sidebar-body"><div class="sidebar-tools"><label class="filter"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="doc-filter" type="search" placeholder="문서 찾기" aria-label="문서 찾기"></label><button id="docs-refresh" type="button" aria-label="목록 새로고침" title="목록 새로고침"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button></div><div id="list-feedback" class="list-feedback"></div><div class="section-head"><h3>프로젝트</h3><button id="project-add" type="button" aria-label="새 프로젝트" title="새 프로젝트"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div><ul id="docs"></ul><div id="search-feedback" class="list-feedback"></div><div class="section-head external-head"><h3>추가한 폴더</h3><button id="folder-add" type="button" aria-label="Finder에서 폴더 추가" title="Finder에서 폴더 추가">+</button></div><ul id="external-docs" aria-label="추가한 폴더"></ul></div></aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-controls="doc-list" aria-label="문서 목록 너비" tabindex="0" aria-valuemin="200" aria-valuemax="480" aria-valuenow="256"></div>
    <main id="editor"><div id="studio" inert></div><section id="shell-panel" aria-live="polite"><p id="shell-message">목록에서 문서를 선택하세요</p><div id="shell-actions"><button id="shell-retry" type="button" hidden>다시 열기</button><button id="shell-reload" type="button" hidden>페이지 새로고침</button><span id="shell-hint" hidden>목록에서 다른 문서를 선택하세요</span></div></section><div id="office-host" hidden></div></main>
  </div>
  <dialog id="import-dialog" aria-labelledby="import-title"><form id="import-form" method="dialog"><h2 id="import-title">Google에서 가져오기</h2><p class="dialog-hint">‘링크가 있는 모든 사용자’로 공유한 시트·문서·슬라이드 주소를 붙여 넣으세요. 편집은 이 컴퓨터의 사본에서 하고, Google 원본은 바뀌지 않습니다.</p><input id="import-url" type="url" inputmode="url" autocomplete="off" placeholder="https://docs.google.com/spreadsheets/d/…" aria-label="Google 공유 링크"><p id="import-error" class="dialog-error" role="alert"></p><div class="dialog-actions"><button id="import-cancel" type="button">취소</button><button id="import-go" type="submit">가져오기</button></div></form></dialog>
</body>
</html>
