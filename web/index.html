<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LIDGE HWP 문서함</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.mjs"></script>
</head>
<body>
  <a class="skip" href="#editor">편집기로 건너뛰기</a>
  <header><h1>LIDGE HWP</h1><span id="filename">문서를 선택하세요</span><button id="copy-path" type="button" disabled>경로 복사</button><p id="status" role="status" aria-live="polite">문서 목록을 불러오는 중</p><button id="save" type="button" disabled>저장</button></header>
  <div class="layout">
    <aside id="doc-list" aria-label="문서 목록"><div class="sidebar-top"><h2>문서함</h2><button id="sidebar-toggle" type="button" aria-controls="doc-list" aria-expanded="true" aria-label="문서 목록 접기" title="문서 목록 접기"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/><path d="m16 15-3-3 3-3"/></svg></button></div><div class="sidebar-body"><div class="sidebar-tools"><label class="filter"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="doc-filter" type="search" placeholder="문서 찾기" aria-label="문서 찾기"></label><button id="docs-refresh" type="button" aria-label="목록 새로고침" title="목록 새로고침"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg></button></div><div class="section-head"><h3>프로젝트</h3><button id="project-add" type="button" aria-label="새 프로젝트" title="새 프로젝트"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg></button></div><ul id="docs"></ul><div class="section-head external-head"><h3>추가한 폴더</h3><button id="folder-add" type="button" aria-label="Finder에서 폴더 추가" title="Finder에서 폴더 추가">+</button></div><ul id="external-docs" aria-label="추가한 폴더"></ul></div></aside>
    <div id="sidebar-resizer" role="separator" aria-orientation="vertical" aria-controls="doc-list" aria-label="문서 목록 너비" tabindex="0" aria-valuemin="200" aria-valuemax="480" aria-valuenow="256"></div>
    <main id="editor"><div id="studio"></div></main>
  </div>
</body>
</html>
